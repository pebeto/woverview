[package]
name = "woverview"
version = "0.2.0"
edition = "2024"
description = "A macOS-style overview of every open window, for sway"

[dependencies]
cairo-rs = "0.22"
memmap2 = "0.9"
pango = "0.22"
pangocairo = "0.22"
rustix = { version = "1.1", features = ["event", "fs", "time"] }
serde_json = "1"
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
lto = "thin"
